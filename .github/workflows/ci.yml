name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # No test touches the network or a live model, so no secrets are needed. Fails if coverage falls below the floor in vitest.config.ts.
      - run: npm run test:coverage
      # Known vulnerabilities in what is actually deployed. Development tools are left to Dependabot, which can wait for a fix.
      - run: npm audit --omit=dev --audit-level=high
